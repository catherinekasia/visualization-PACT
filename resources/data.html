<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Country Comparison | Visualization-PACT</title>
  <link rel="stylesheet" href="styles.css" />
  
  <style>
    /* Country Selector Styles */
    .country-item {
      padding: 6px 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      border-radius: 4px;
      transition: background 0.2s;
      margin-bottom: 2px;
    }
    .country-item:hover {
      background: rgba(56, 189, 248, 0.1);
    }
    .country-checkbox {
      cursor: pointer;
      width: 16px;
      height: 16px;
    }
    .country-label {
      cursor: pointer;
      flex: 1;
      color: #e2e8f0;
      font-size: 13px;
    }
    .selected-countries-area {
      background: rgba(15, 23, 42, 0.5);
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 16px;
      min-height: 60px;
    }
    
    /* Search Input */
    #country-search {
      width: 100%;
      padding: 10px 12px;
      margin-bottom: 12px;
      border: 1px solid #475569;
      background: #1e293b;
      color: #e2e8f0;
      border-radius: 6px;
      font-size: 14px;
    }
    #country-search:focus {
      outline: none;
      border-color: #38bdf8;
      box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.1);
    }
    #country-search::placeholder {
      color: #64748b;
    }
    
    /* Country List */
    #country-list {
      max-height: 250px;
      overflow-y: auto;
      overflow-x: hidden;
      padding-right: 4px;
    }
    #country-list::-webkit-scrollbar {
      width: 8px;
    }
    #country-list::-webkit-scrollbar-track {
      background: #1e293b;
      border-radius: 4px;
    }
    #country-list::-webkit-scrollbar-thumb {
      background: #475569;
      border-radius: 4px;
    }
    #country-list::-webkit-scrollbar-thumb:hover {
      background: #64748b;
    }
    
    /* Selected Tags */
    .selected-tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(56, 189, 248, 0.2);
      color: #38bdf8;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 12px;
      margin: 2px;
    }
    .remove-tag {
      background: none;
      border: none;
      color: #38bdf8;
      cursor: pointer;
      font-size: 16px;
      line-height: 1;
      padding: 0;
      width: 16px;
      height: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .remove-tag:hover {
      color: #0ea5e9;
    }
    
    /* Section Divider */
    .section-divider {
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid #334155;
    }
    
    /* Compact Attribute Groups */
    .attributes-scroll.compact {
      max-height: 200px !important;
    }
    .compact .attribute-group {
      margin-bottom: 8px;
    }
    .compact .group-title {
      font-size: 11px;
      padding: 4px 0;
    }
    .compact .attribute-item {
      padding: 3px 0;
    }
    .compact .attribute-label {
      font-size: 12px;
    }
  </style>
</head>
<body class="page-data">
  <div class="centered-bg">
    <div class="main-layout">
      <!-- Sidebar Nav -->
      <aside class="sidebar-nav">
        <nav class="nav-list">
          <a class="nav-item" href="index.html" title="Map">
            <span class="nav-icon">
              <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#b6c2e2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"/>
              </svg>
            </span>
          </a>
          
          <a class="nav-item active" href="data.html" title="Data">
            <span class="nav-icon">
              <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#b6c2e2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="12" width="6" height="8"/><rect x="9" y="8" width="6" height="12"/><rect x="15" y="4" width="6" height="16"/>
              </svg>
            </span>
          </a>

          <a class="nav-item" href="indexes.html" title="Indexes">
            <span class="nav-icon">
              <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#b6c2e2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 3v18h18"/><path d="M7 14l4-4 3 3 6-6"/>
              </svg>
            </span>
          </a>

          <a class="nav-item" href="settings.html" title="Settings">
            <span class="nav-icon">
              <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#b6c2e2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h.09a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51h.09a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v.09a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
              </svg>
            </span>
          </a>
        </nav>
      </aside>

      <!-- Main Content -->
      <section class="map-section-modern" style="height:100%;">
        <div class="explorer-container">
          
          <!-- Left Panel - Selection -->
          <div class="attributes-panel">
            
            <!-- Country Selection Section -->
            <div class="section-title">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:18px;height:18px;">
                <circle cx="12" cy="12" r="10"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/><path d="M2 12h20"/>
              </svg>
              SELECT COUNTRIES
              <span class="selected-count" id="country-count">0/5</span>
            </div>

            <div class="selected-countries-area">
              <div id="selected-countries" style="display:flex; flex-wrap:wrap; gap:6px;"></div>
            </div>

            <div id="country-selector">
              <div class="loading" style="padding:20px; text-align:center; color:#64748b;">
                Loading countries...
              </div>
            </div>

            <!-- Attribute Selection Section -->
            <div class="section-divider">
              <div class="section-title" style="font-size:0.95em; margin-bottom:8px;">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:16px;height:16px;">
                  <path d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
                </svg>
                SELECT ATTRIBUTES
                <span class="selected-count" id="selected-count">0/10</span>
              </div>

              <div class="selected-tags" id="selected-tags" style="margin-bottom:8px;"></div>

              <div class="attributes-scroll compact">
                <div class="attribute-group">
                  <div class="group-title">Indexes</div>
                  <div id="Indexes-attributes"></div>
                </div>
                
                <div class="attribute-group">
                  <div class="group-title">Demographics</div>
                  <div id="demographics-attributes"></div>
                </div>

                <div class="attribute-group">
                  <div class="group-title">Economy</div>
                  <div id="economy-attributes"></div>
                </div>

                <div class="attribute-group">
                  <div class="group-title">Energy</div>
                  <div id="energy-attributes"></div>
                </div>

                <div class="attribute-group">
                  <div class="group-title">Communications</div>
                  <div id="communications-attributes"></div>
                </div>
              </div>
            </div>

            <!-- Compare Button -->
            <button class="find-button" id="compare-countries" disabled style="margin-top:12px;">
              COMPARE COUNTRIES
            </button>
          </div>

          <!-- Right Panel - Results -->
          <div class="results-panel">
            
            <!-- Country Cards -->
            <div class="result-card">
              <div class="section-title">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:18px;height:18px;">
                  <path d="M16 8v8m-4-5v5m-4-2v2m-2 4h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/>
                </svg>
                SELECTED COUNTRIES
              </div>
              <div class="country-results" id="country-results">
                <div class="loading" style="padding:40px 20px; text-align:center; color:#64748b;">
                  Select countries and attributes, then click "Compare Countries"
                </div>
              </div>
            </div>

            <!-- Comparison Chart -->
            <div class="result-card">
              <div class="section-title">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:18px;height:18px;">
                  <polygon points="12 2 2 7 12 12 22 7 12 2"/>
                  <polyline points="2 17 12 22 22 17"/>
                  <polyline points="2 12 12 17 22 12"/>
                </svg>
                COMPARISON CHART
              </div>
              <div id="radar-container" style="min-height:400px; display:flex; align-items:center; justify-content:center;">
                <div class="loading" style="text-align:center; color:#64748b;">
                  Waiting for comparison...
                </div>
              </div>
            </div>
            
          </div>

        </div>
      </section>
    </div>
  </div>

  <!-- Libraries -->
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
  <script src="js/neutralino.js"></script>
  <script src="js/d3.v7.min.js"></script>
  <script src="data-config.js"></script>
  <script src="data.js"></script>
</body>
</html>
