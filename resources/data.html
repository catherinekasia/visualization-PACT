<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Country Comparison | Visualization-PACT</title>
  <link rel="stylesheet" href="styles.css" />

  <style>
    /* ==========================================
       COUNTRY SELECTOR STYLES
       ========================================== */
    .country-item {
      padding: 6px 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      border-radius: 4px;
      transition: background 0.2s;
      margin-bottom: 2px;
    }
    .country-item:hover {
      background: rgba(56, 189, 248, 0.1);
    }
    .country-checkbox {
      cursor: pointer;
      width: 16px;
      height: 16px;
    }
    .country-label {
      cursor: pointer;
      flex: 1;
      color: #e2e8f0;
      font-size: 13px;
    }

    .selected-countries-area {
      background: rgba(15, 23, 42, 0.5);
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 12px;
      display: block;
    }

    /* ==========================================
       SEARCH INPUT
       ========================================== */
    #country-search {
      width: 100%;
      padding: 10px 12px;
      margin-bottom: 12px;
      border: 1px solid #475569;
      background: #1e293b;
      color: #e2e8f0;
      border-radius: 6px;
      font-size: 14px;
    }
    #country-search:focus {
      outline: none;
      border-color: #38bdf8;
      box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.1);
    }
    #country-search::placeholder {
      color: #64748b;
    }

    /* ==========================================
       COUNTRY LIST SCROLLBAR
       ========================================== */
    #country-list {
      max-height: 250px;
      overflow-y: auto;
      overflow-x: hidden;
      padding-right: 4px;
    }
    #country-list::-webkit-scrollbar {
      width: 8px;
    }
    #country-list::-webkit-scrollbar-track {
      background: #1e293b;
      border-radius: 4px;
    }
    #country-list::-webkit-scrollbar-thumb {
      background: #475569;
      border-radius: 4px;
    }
    #country-list::-webkit-scrollbar-thumb:hover {
      background: #64748b;
    }

    /* ==========================================
       SELECTED TAGS
       ========================================== */
    .selected-tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(56, 189, 248, 0.2);
      color: #38bdf8;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 12px;
      margin: 2px;
    }
    #selected-countries:empty::before{
      content: "No countries selected";
      color: #64748b;
      font-size: 12px;
    }

    #selected-countries{
      display:flex;
      flex-wrap:wrap;
      gap:6px;
    }

    .remove-tag {
      background: none;
      border: none;
      color: #38bdf8;
      cursor: pointer;
      font-size: 16px;
      line-height: 1;
      padding: 0;
      width: 16px;
      height: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .remove-tag:hover {
      color: #0ea5e9;
    }

    /* ==========================================
       SECTION DIVIDERS
       ========================================== */
    .section-divider {
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid #334155;
    }

    /* ==========================================
       COMPACT ATTRIBUTE GROUPS
       ========================================== */
    .attributes-scroll.compact {
      max-height: 200px !important;
    }
    .compact .attribute-group {
      margin-bottom: 8px;
    }
    .compact .group-title {
      font-size: 11px;
      padding: 4px 0;
    }
    .compact .attribute-item {
      padding: 3px 0;
    }
    .compact .attribute-label {
      font-size: 12px;
    }

    /* ==========================================
       LAYOUT - Clean Two-Column Design
       ========================================== */
    .map-section-modern {
      min-height: 100vh;
      overflow: visible;
    }

    .explorer-container {
      display: flex;
      min-height: 100vh;
      gap: 0;
    }

    /* Left Panel: Fixed width, scrollable */
    .attributes-panel {
      width: 360px;
      min-width: 360px;
      max-width: 360px;
      height: 100vh;
      overflow-y: auto;
      background: rgba(15, 23, 42, 0.7);
      border-right: 2px solid rgba(56, 189, 248, 0.15);
      padding: 20px;
    }

    /* ==========================
   TOP NAV (Compare / Weights)
   ========================== */
    .results-topnav{
      display:flex;
      gap:10px;
      align-items: center;
      margin-bottom:12px;
    }

    .mode-btn{
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(148, 163, 184, 0.25);
      color:#e2e8f0;
      padding: 8px 12px;
      border-radius: 10px;
      cursor:pointer;
      font-size: 13px;
      line-height: 1;
      height: 36px;
      display:flex;
      align-items:center;
    }

    .mode-btn.active{
      border-color: rgba(56, 189, 248, 0.65);
      box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.12);
    }

    .mode-btn:hover{
      border-color: rgba(56, 189, 248, 0.45);
    }


    /* Right Panel: Takes remaining space */
    .results-panel {
      flex: 1;
      min-height: 100vh;
      overflow-y: auto;
      padding: 12px 12px; /* reduce top/bottom padding to remove large gap */
      display: flex;
      flex-direction: column;
      gap: 8px;
      background: rgba(23, 33, 47, 0.5);
    }

    /* ==========================================
       RESULTS HEADER - ULTRA COMPACT
       ========================================== */
    .results-header {
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(148, 163, 184, 0.2);
      border-radius: 8px;
      padding: 10px 16px;
      margin-bottom: 16px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .results-header h2 {
      color: #e2e8f0;
      font-size: 13px;
      font-weight: 600;
      margin: 0;
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }

    .compared-countries-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      flex: 0 0 auto;
      align-items: center;
    }

    .compared-country-tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(56, 189, 248, 0.08);
      border: 1px solid rgba(56, 189, 248, 0.18);
      color: #38bdf8;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 500;
    }

    .country-color-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.35);
      flex-shrink: 0;
    }

    /* ==========================================
       VISUALIZATIONS CONTAINER
       ========================================== */
    #visualizations-container {
      display: flex;
      flex-direction: column;
      gap: 24px;
      max-width: 1400px;
      margin: 0 auto;
    }


    #visualizations-container .loading {
      padding: 10px 0;
    }


    /* ==========================================
       CHART CARDS
       ========================================== */
    .chart-card {
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid rgba(148, 163, 184, 0.25);
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
      margin-top: 0;
    }

    .chart-wide {
      max-width: 100%;
    }

    .chart-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 2px solid rgba(56, 189, 248, 0.2);
    }

    .chart-title {
      display: flex;
      align-items: center;
      gap: 10px;
      color: #e2e8f0;
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 2px solid rgba(56, 189, 248, 0.2);
    }

    /* ==========================================
       CHART WRAPPER - Horizontal Scroll
       ========================================== */
    .chart-wrapper {
      overflow-x: auto;
      overflow-y: visible;
      margin: 0 -24px;
      padding: 0 24px;
    }

    .chart-wrapper::-webkit-scrollbar {
      height: 10px;
    }

    .chart-wrapper::-webkit-scrollbar-track {
      background: rgba(30, 41, 59, 0.5);
      border-radius: 5px;
    }

    .chart-wrapper::-webkit-scrollbar-thumb {
      background: rgba(71, 85, 105, 0.8);
      border-radius: 5px;
    }

    .chart-wrapper::-webkit-scrollbar-thumb:hover {
      background: rgba(100, 116, 139, 0.9);
    }

    /* ==========================================
       SVG CHART SIZING
       ========================================== */
    .chart-card svg {
      display: block;
      min-width: 600px;
    }

    /* ==========================================
       MULTI-LINE TEXT IN CHARTS
       Critical: Forces attribute labels to wrap
       ========================================== */
    
    /* Attribute labels in grouped bar chart */
    .chart-card text.attr-label tspan {
      font-size: 10px !important;
      fill: #94a3b8;
    }

    /* Parallel coordinates labels */
    .chart-card text tspan {
      font-size: 10px !important;
    }

    /* All axis text */
    .chart-card .axis text,
    .chart-card g.axis text {
      font-size: 10px !important;
      fill: #94a3b8;
    }

    /* Legend text */
    .chart-card .legend text {
      font-size: 11px !important;
      fill: #e2e8f0;
    }

    /* Value labels */
    .chart-card text.value {
      font-size: 11px !important;
      fill: #e2e8f0;
      font-weight: 600;
    }

    /* Country names */
    .chart-card text.country {
      font-size: 11px !important;
      fill: #94a3b8;
    }

    /* ==========================================
       LOADING STATE
       ========================================== */
    .loading {
      text-align: center;
      color: #94a3b8;
      padding: 60px 20px;
      font-size: 14px;
    }

    /* ==========================================
       TOOLTIP (for interactive charts)
       ========================================== */
    #tooltip {
      position: fixed;
      display: none;
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid rgba(56, 189, 248, 0.4);
      border-radius: 8px;
      padding: 12px 16px;
      pointer-events: none;
      z-index: 10000;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
      color: #e2e8f0;
      font-size: 13px;
      line-height: 1.6;
      max-width: 280px;
    }

    /* ==========================================
       RESPONSIVE DESIGN
       ========================================== */
    @media (max-width: 1024px) {
      .explorer-container {
        flex-direction: column;
      }
      .attributes-panel {
        width: 100%;
        max-width: 100%;
        height: auto;
        border-right: none;
        border-bottom: 2px solid rgba(56, 189, 248, 0.15);
      }
      .results-panel {
        min-height: auto;
      }
    }

    @media (max-width: 768px) {
      .chart-card {
        padding: 16px;
      }
      .chart-card svg {
        min-width: 400px;
      }
    }

    .results-panel{
      display: block !important;
    }

    #visualizations-container{
      display: block !important;
      margin-top: 0 !important;
      padding-top: 0 !important;
      min-height: 0 !important;
    }

    #visualizations-container > *:first-child{
      margin-top: 0 !important;
    }

    .chart-card{
      margin-top: 0 !important;
    }

  </style>
</head>
