<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Indexes Maps</title>
  <link rel="stylesheet" href="styles.css" />

  <style>
    .indexes-wrap { height: 100vh; width: 100vw; display: flex; }
    .map-section-modern { flex: 1; background: #232b3e; overflow: auto; }
    .page-pad { padding: 18px; }

    .maps-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
    }
    @media (max-width: 1200px) { .maps-grid { grid-template-columns: 1fr; } }

    .map-card {
      background: rgba(15, 23, 42, 0.65);
      border: 1px solid rgba(148, 163, 184, 0.18);
      border-radius: 14px;
      padding: 12px;
      box-shadow: 0 10px 22px rgba(0,0,0,0.35);
      overflow: hidden;
    }
    .map-card h3 {
      margin: 0 0 8px 0;
      color: #e2e8f0;
      font-size: 14px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .legend { display:flex; align-items:center; gap:8px; font-size:12px; color:#94a3b8; }
    .legend-bar {
      width: 140px; height: 10px; border-radius: 8px;
      border: 1px solid rgba(148, 163, 184, 0.25);
      background: linear-gradient(90deg, #22c55e, #f59e0b, #ef4444);
    }
    .map-host { width: 100%; height: 360px; }
    .map-loading { color:#94a3b8; font-size: 13px; padding: 16px 0; }

    .tooltip {
      position: fixed;
      pointer-events: none;
      z-index: 9999;
      background: rgba(2, 6, 23, 0.92);
      border: 1px solid rgba(148, 163, 184, 0.25);
      color: #e2e8f0;
      padding: 8px 10px;
      border-radius: 10px;
      font-size: 12px;
      box-shadow: 0 12px 26px rgba(0,0,0,0.4);
      transform: translate(-50%, -120%);
      white-space: nowrap;
      display: none;
    }
  </style>
</head>

<body class="page-map">
  <div class="centered-bg">
    <div class="main-layout">
      <aside class="sidebar-nav">
        <nav class="nav-list">

                <polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"/>
              </svg>
            </span>
          </a>
          <a class="nav-item" href="data.html" title="Data">
            <span class="nav-icon">
              <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#b6c2e2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="12" width="6" height="8"/><rect x="9" y="8" width="6" height="12"/><rect x="15" y="4" width="6" height="16"/>
              </svg>
            </span>
          </a>

          <a class="nav-item active" href="indexes.html" title="Indexes">
            <span class="nav-icon">
              <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#b6c2e2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 3v18h18"/><path d="M7 14l4-4 3 3 6-6"/>
              </svg>
            </span>
          </a>

          <a class="nav-item" href="settings.html" title="Settings">

              <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#b6c2e2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h.09a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51h.09a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v.09a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>

            </span>
          </a>
        </nav>
      </aside>

      <div class="result-card">
  <div class="section-title" style="display:flex;align-items:center;justify-content:space-between;gap:12px;">
    <div style="display:flex;align-items:center;gap:10px;">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:18px;height:18px;">
        <path d="M3 3v18h18"/><path d="M7 14l4-4 3 3 6-6"/>
      </svg>
      INDEX MAP
    </div>

    <div id="index-tabs" style="display:flex;gap:8px;flex-wrap:wrap;">
      <button class="map-btn" data-key="gpi">Global Peace</button>
      <button class="map-btn" data-key="crime">Criminal</button>
      <button class="map-btn" data-key="gti">Terrorism</button>
      <button class="map-btn" data-key="safety">Safety</button>
      <button class="map-btn" data-key="health">Health</button>
    </div>
  </div>

  <div style="display:flex;align-items:center;justify-content:center;margin:10px 0 0 0;color:#94a3b8;font-size:12px;">
    <span id="legend-label">Low</span>
    <span style="width:180px;height:10px;border-radius:999px;margin:0 10px;border:1px solid rgba(148,163,184,.25);
      background: linear-gradient(90deg, #22c55e, #f59e0b, #ef4444);"></span>
    <span>High</span>
  </div>

  <div id="single-map-host" style="width:100%;height:520px;margin-top:10px;">
    <div class="loading">Loading map…</div>
  </div>
</div>

</html>
