      <section class="map-section-modern" style="display:flex;align-items:center;justify-content:center;width:100%;height:100%;">
        <div style="width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;">
          <h1 style="color:#b6c2e2;font-family:Inter,sans-serif;font-size:2.2rem;">Three.js Test Page</h1>
          <canvas id="three-canvas" style="display:block;width:640px;height:420px;background:#181f2a;border-radius:8px;"></canvas>
        </div>
      </section>
    </div>
    <script type="module">
      import * as THREE from "three";
      const canvas = document.getElementById("three-canvas");
      const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
      renderer.setSize(640, 420);
      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x181f2a);
      const camera = new THREE.PerspectiveCamera(75, 640/420, 0.1, 1000);
      camera.position.z = 3;
      const geometry = new THREE.BoxGeometry();
      const material = new THREE.MeshStandardMaterial({ color: 0x38bdf8 });
      const cube = new THREE.Mesh(geometry, material);
      scene.add(cube);
      const light = new THREE.DirectionalLight(0xffffff, 1);
      light.position.set(2, 2, 5);
      scene.add(light);
      function animate() {
        requestAnimationFrame(animate);
        cube.rotation.x += 0.01;
        cube.rotation.y += 0.01;
        renderer.render(scene, camera);
      }
      animate();
    </script>
  </div>
