<!DOCTYPE html>
<html>
<head>
  <title>Data Diagnostic Test</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      padding: 20px;
      background: #0f172a;
      color: #e2e8f0;
      margin: 0;
    }
    .back-button {
      position: fixed;
      top: 20px;
      left: 20px;
      background: #38bdf8;
      color: #0f172a;
      padding: 10px 20px;
      border-radius: 6px;
      text-decoration: none;
      font-weight: 600;
      z-index: 1000;
    }
    .back-button:hover {
      background: #0ea5e9;
    }
    .container {
      max-width: 1200px;
      margin: 60px auto 20px auto;
    }
    .section {
      background: #1e293b;
      padding: 20px;
      margin: 20px 0;
      border: 1px solid #334155;
      border-radius: 8px;
    }
    h1 {
      color: #38bdf8;
      text-align: center;
    }
    h2 {
      color: #38bdf8;
      margin-top: 0;
    }
    .found {
      color: #22c55e;
    }
    .missing {
      color: #ef4444;
    }
    pre {
      background: #020617;
      padding: 15px;
      border-radius: 4px;
      overflow-x: auto;
      font-size: 12px;
      line-height: 1.6;
      max-height: 400px;
      overflow-y: auto;
    }
    .key {
      color: #fbbf24;
      font-weight: bold;
    }
    .value {
      color: #38bdf8;
    }
    .loading {
      text-align: center;
      padding: 40px;
      font-size: 18px;
      color: #94a3b8;
    }
  </style>
</head>
<body>
  <a href="data.html" class="back-button">← Back to App</a>
  
  <div class="container">
    <h1>🔍 Data Diagnostic Tool</h1>
    <div id="output">
      <div class="loading">Loading data files...</div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
  <script src="js/neutralino.js"></script>
  <script src="data-config.js"></script>
  
  <script>
    Neutralino.init();
    
    const output = document.getElementById('output');
    
    async function loadCsv(path) {
      try {
        const content = await Neutralino.filesystem.readFile(path);
        return new Promise((resolve, reject) => {
          Papa.parse(content, {
            header: true,
            dynamicTyping: true,
            skipEmptyLines: true,
            complete: (results) => resolve(results.data || []),
            error: (err) => reject(err)
          });
        });
      } catch (e) {
        console.error("Failed to read file:", path, e);
        return [];
      }
    }

    async function runDiagnostics() {
      const DATA_FILES = [
        "data/filtered_cia_data/demographics_data.csv",
        "data/filtered_cia_data/communications_data.csv",
        "data/filtered_cia_data/economy_data.csv",
        "data/filtered_cia_data/energy_data.csv",
        "data/filtered_cia_data/Indexes_calc_code/safety_index_risk_focused.csv",
        "data/filtered_cia_data/Indexes_calc_code/health_index.csv",
        "data/filtered_cia_data/Indexes_calc_code/DPI.csv",
        "data/filtered_cia_data/Indexes_calc_code/earning_potential_epi_future.csv",
        "data/filtered_cia_data/Indexes_calc_code/economic_stability_option_c.csv",
        "data/filtered_cia_data/Indexes_calc_code/good_country_index_option3.csv"
      ];

      const datasets = await Promise.all(DATA_FILES.map(loadCsv));
      
      // Merge data
      const merged = new Map();
      
      for (const rows of datasets) {
        for (const row of rows) {
          const country = row.Country ?? row.country ?? row.COUNTRY;
          if (!country) continue;
          
          const mappedRow = {};
          for (const [csvKey, value] of Object.entries(row)) {
            mappedRow[csvKey] = value;
            const normalized1 = csvKey.trim().replace(/\s+/g, '_');
            const normalized2 = csvKey.trim().replace(/\s+/g, '_').replace(/-/g, '_');
            const normalized3 = csvKey.trim().replace(/[^\w]/g, '_');
            const normalized4 = csvKey.trim().replace(/\s+/g, '');
            mappedRow[normalized1] = value;
            mappedRow[normalized2] = value;
            mappedRow[normalized3] = value;
            mappedRow[normalized4] = value;
            mappedRow[csvKey.toLowerCase().trim()] = value;
            mappedRow[normalized1.toLowerCase()] = value;
          }
          
          const k = country.toLowerCase().trim();
          const prev = merged.get(k) || { Country: country };
          merged.set(k, { ...prev, ...mappedRow, Country: prev.Country || country });
        }
      }
      
      const SAMPLE_DATA = Array.from(merged.values());
      
      // Get all attribute keys from config
      const allAttrKeys = Object.values(window.ATTRIBUTES || {})
        .flatMap(category => Object.entries(category))
        .map(([key, meta]) => ({ key, label: meta.label }));
      
      let html = `
        <div class="section">
          <h2>📊 Data Summary</h2>
          <p>Loaded <strong>${SAMPLE_DATA.length}</strong> countries</p>
          <p>Loaded <strong>${DATA_FILES.length}</strong> CSV files</p>
          <p>Checking <strong>${allAttrKeys.length}</strong> attributes from data-config.js</p>
        </div>
      `;
      
      if (SAMPLE_DATA.length > 0) {
        const firstCountry = SAMPLE_DATA[0];
        const allKeys = Object.keys(firstCountry).sort();
        
        html += `
          <div class="section">
            <h2>📝 All Columns in ${firstCountry.Country} (${allKeys.length} columns)</h2>
            <pre>${allKeys.join('\n')}</pre>
          </div>
        `;
        
        // Check each attribute
        const found = [];
        const missing = [];
        
        allAttrKeys.forEach(({ key, label }) => {
          const exists = key in firstCountry;
          const value = firstCountry[key];
          const isValid = typeof value === 'number' && !Number.isNaN(value);
          
          if (exists && isValid) {
            found.push({ key, label, value });
          } else {
            missing.push({ key, label, exists, value });
          }
        });
        
        html += `
          <div class="section">
            <h2 class="found">✅ Found Attributes (${found.length})</h2>
            <pre>`;
        
        found.forEach(({ key, label, value }) => {
          html += `<span class="key">${key}</span> → "${label}" = <span class="value">${value}</span>\n`;
        });
        
        html += `</pre>
          </div>
        `;
        
        if (missing.length > 0) {
          html += `
            <div class="section">
              <h2 class="missing">❌ Missing Attributes (${missing.length})</h2>
              <p style="color: #fbbf24;">These attributes are defined in data-config.js but NOT found in your CSV files:</p>
              <pre>`;
          
          missing.forEach(({ key, label, exists, value }) => {
            if (exists) {
              html += `<span class="key">${key}</span> → "${label}" = EXISTS but invalid: ${value}\n`;
            } else {
              html += `<span class="key">${key}</span> → "${label}" = NOT FOUND IN DATA\n`;
            }
          });
          
          html += `</pre>
            </div>
          `;
          
          // Try to find similar keys
          html += `
            <div class="section">
              <h2>🔍 Suggestions for Missing Attributes</h2>
              <p>Looking for similar column names in your CSV files:</p>
              <pre>`;
          
          let foundSuggestions = false;
          missing.forEach(({ key, label }) => {
            const searchTerm = key.toLowerCase().replace(/_/g, '');
            const similar = allKeys.filter(k => {
              const kClean = k.toLowerCase().replace(/[^a-z0-9]/g, '');
              return kClean.includes(searchTerm.substring(0, Math.max(5, searchTerm.length - 3))) ||
                     searchTerm.substring(0, Math.max(5, searchTerm.length - 3)).includes(kClean);
            });
            
            if (similar.length > 0) {
              foundSuggestions = true;
              html += `\n<span class="missing">${key}</span> → "${label}"\n`;
              html += `  Similar columns found:\n`;
              similar.slice(0, 5).forEach(s => {
                html += `    • <span class="found">${s}</span>\n`;
              });
            }
          });
          
          if (!foundSuggestions) {
            html += 'No similar column names found. These columns may not exist in your CSV files.';
          }
          
          html += `</pre>
            </div>
          `;
        }
      }
      
      output.innerHTML = html;
    }
    
    runDiagnostics().catch(err => {
      output.innerHTML = `<div class="section"><h2 class="missing">Error</h2><p>${err.message}</p></div>`;
    });
  </script>
</body>
</html>
